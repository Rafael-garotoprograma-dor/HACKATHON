services:
  - type: web
    name: clinica-escola-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-escola-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

  # Novo endereço público; compartilha o banco existente sem recarregar usuários.
  - type: web
    name: integra-clinica-anhanguera
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-escola-db
          property: connectionString
      - key: APP_ORIGIN
        value: https://integra-clinica-anhanguera.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "false"

databases:
  - name: clinica-escola-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
