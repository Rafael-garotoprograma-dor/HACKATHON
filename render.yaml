services:
  - type: web
    name: clinica-escola-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-escola-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: clinica-escola-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
